<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor CT-e → Excel</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
.container{max-width:980px;margin:40px auto;padding:20px}.card{background:white;border-radius:18px;padding:30px;box-shadow:0 8px 30px #00000012}
h1{margin:0 0 8px;font-size:30px}.sub{color:#667085;margin:0 0 25px}
.drop{border:2px dashed #4472c4;border-radius:16px;padding:48px 20px;text-align:center;background:#f8fbff;cursor:pointer;transition:.2s}
.drop:hover,.drop.drag{background:#eef5ff}.drop strong{display:block;font-size:20px;margin-bottom:8px}.drop span{color:#667085}
input{display:none}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
button{border:0;border-radius:10px;padding:13px 20px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:#4472c4;color:#fff}.secondary{background:#e8eef8;color:#294b83}.danger{background:#fee4e2;color:#b42318}
button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.stat{background:#f7f9fc;padding:15px;border-radius:12px}.stat b{display:block;font-size:24px}.stat small{color:#667085}
.status{margin-top:20px;padding:14px;border-radius:10px;background:#f2f4f7;color:#344054;white-space:pre-wrap}
footer{text-align:center;color:#98a2b3;font-size:12px;margin-top:18px}
@media(max-width:650px){.container{margin:10px auto}.card{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>Conversor CT-e → Excel</h1>
<p class="sub">Converta XMLs de CT-e ou um lote ZIP diretamente no navegador.</p>

<label class="drop" id="drop">
<strong>📦 Selecione ou arraste seus arquivos aqui</strong>
<span>ACEITA XML e ZIP com XMLs de CT-e</span>
<input id="files" type="file" multiple accept=".xml,.zip">
</label>

<div class="actions">
<button class="primary" id="convert" disabled>Converter para Excel</button>
<button class="secondary" id="clear" disabled>Limpar</button>
</div>

<div class="stats">
<div class="stat"><b id="nFiles">0</b><small>Arquivos selecionados</small></div>
<div class="stat"><b id="nXml">0</b><small>XMLs encontrados</small></div>
<div class="stat"><b id="nCte">0</b><small>CT-es convertidos</small></div>
<div class="stat"><b id="nErr">0</b><small>Erros</small></div>
</div>

<div class="status" id="status">Nenhum arquivo selecionado.</div>
</div>
<footer>Os XMLs são processados localmente no navegador. O conteúdo não é enviado para um servidor por esta aplicação.</footer>
</div>

<script>
const NS="http://www.portalfiscal.inf.br/cte";
const $=id=>document.getElementById(id);
let selected=[], xmls=[], errors=[];

$("drop").onclick=e=>{if(e.target.tagName!=="BUTTON")$("files").click()};
$("files").onchange=e=>{selected=[...e.target.files]; updateFiles()};
["dragenter","dragover"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("drag")}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.remove("drag")}));
$("drop").addEventListener("drop",e=>{selected=[...e.dataTransfer.files];updateFiles()});
$("clear").onclick=()=>{selected=[];xmls=[];errors=[];$("files").value="";updateFiles();$("status").textContent="Nenhum arquivo selecionado."};

function updateFiles(){
 $("nFiles").textContent=selected.length;$("nXml").textContent=0;$("nCte").textContent=0;$("nErr").textContent=0;
 $("convert").disabled=!selected.length;$("clear").disabled=!selected.length;
 $("status").textContent=selected.length?`${selected.length} arquivo(s) selecionado(s). Clique em “Converter para Excel”.`:"Nenhum arquivo selecionado.";
}

function txt(node,path,def=""){
 if(!node)return def; const parts=path.split("/"); let n=node;
 for(const p of parts){n=[...n.children].find(x=>x.localName===p);if(!n)break}
 return n?.textContent?.trim()||def;
}
function num(v){const x=parseFloat(v||0);return isNaN(x)?0:x}
function first(node,...paths){for(const p of paths){let v=txt(node,p);if(v)return v}return ""}

async function extract(){
 const out=[];
 for(const f of selected){
   if(f.name.toLowerCase().endsWith(".xml")) out.push({name:f.name,text:await f.text()});
   else if(f.name.toLowerCase().endsWith(".zip")){
     try{
       const zip=await JSZip.loadAsync(await f.arrayBuffer());
       for(const name of Object.keys(zip.files)){
         if(name.toLowerCase().endsWith(".xml")&&!zip.files[name].dir)
           out.push({name:name.split("/").pop(),text:await zip.files[name].async("text")});
       }
     }catch(e){errors.push([f.name,"ZIP inválido ou corrompido."])}
   }
 }
 return out;
}

function parseCTe(item){
 const doc=new DOMParser().parseFromString(item.text,"application/xml");
 if(doc.querySelector("parsererror"))throw new Error("XML inválido.");
 const inf=doc.getElementsByTagNameNS(NS,"infCte")[0];
 if(!inf)throw new Error("Não é um CT-e reconhecível.");
 const ide=inf.getElementsByTagNameNS(NS,"ide")[0], emit=inf.getElementsByTagNameNS(NS,"emit")[0],
 rem=inf.getElementsByTagNameNS(NS,"rem")[0], dest=inf.getElementsByTagNameNS(NS,"dest")[0],
 vp=inf.getElementsByTagNameNS(NS,"vPrest")[0], carga=inf.getElementsByTagNameNS(NS,"infCarga")[0],
 imp=inf.getElementsByTagNameNS(NS,"imp")[0], prot=doc.getElementsByTagNameNS(NS,"infProt")[0];
 const toma=inf.getElementsByTagNameNS(NS,"toma3")[0]||inf.getElementsByTagNameNS(NS,"toma4")[0];
 const icms=imp?.getElementsByTagNameNS(NS,"ICMS00")[0]||imp?.getElementsByTagNameNS(NS,"ICMS20")[0];
 const chave=(inf.getAttribute("Id")||"").replace(/^CTe/,"");
 const n={
 "Arquivo":item.name,"Chave CT-e":chave,"Número CT-e":txt(ide,"nCT"),"Série":txt(ide,"serie"),
 "Modelo":txt(ide,"mod"),"Data Emissão":first(ide,"dhEmi","dEmi"),"CFOP":txt(ide,"CFOP"),
 "Natureza Operação":txt(ide,"natOp"),"Modal":txt(ide,"modal"),"Tipo Serviço":txt(ide,"tpServ"),
 "Origem":first(ide,"xMunIni"),"UF Origem":first(ide,"UFIni"),"Destino":first(ide,"xMunFim"),
 "UF Destino":first(ide,"UFFim"),"Emitente CNPJ":txt(emit,"CNPJ")||txt(emit,"CPF"),
 "Emitente Razão Social":txt(emit,"xNome"),"Emitente Fantasia":txt(emit,"xFant"),
 "Remetente CNPJ/CPF":txt(rem,"CNPJ")||txt(rem,"CPF"),"Remetente Razão Social":txt(rem,"xNome"),
 "Remetente Município":txt(rem,"enderReme/xMun"),"Remetente UF":txt(rem,"enderReme/UF"),
 "Destinatário CNPJ/CPF":txt(dest,"CNPJ")||txt(dest,"CPF"),"Destinatário Razão Social":txt(dest,"xNome"),
 "Destinatário Município":txt(dest,"enderDest/xMun"),"Destinatário UF":txt(dest,"enderDest/UF"),
 "Tomador CNPJ/CPF":txt(toma,"CNPJ")||txt(toma,"CPF"),"Tomador Razão Social":txt(toma,"xNome"),
 "Valor Prestação":num(txt(vp,"vTPrest")),"Valor a Receber":num(txt(vp,"vRec")),
 "Valor ICMS":num(txt(icms,"vICMS")),"Alíquota ICMS":num(txt(icms,"pICMS")),
 "Valor Carga":num(txt(carga,"vCarga")),"Produto Predominante":txt(carga,"proPred"),
 "Peso Bruto":0,"Unidade Peso":"","Protocolo":txt(prot,"nProt"),"Status CT-e":txt(prot,"xMotivo")
 };
 const qs=carga?[...carga.getElementsByTagNameNS(NS,"infQ")]:[];
 const q=qs.find(x=>(txt(x,"tpMed")||"").toUpperCase().includes("PESO BRUTO"))||qs[0];
 if(q){n["Peso Bruto"]=num(txt(q,"qCarga"));n["Unidade Peso"]=txt(q,"cUnid")}
 return {n,inf,docs:parseDocs(inf,item.name,chave,n["Número CT-e"])};
}

function parseDocs(inf,name,chave,nct){
 const arr=[];
 for(const x of inf.getElementsByTagNameNS(NS,"infNFe"))
   arr.push({"Arquivo":name,"Chave CT-e":chave,"Número CT-e":nct,"Tipo Documento":"NF-e","Chave Documento":txt(x,"chave"),"Número Documento":txt(x,"nDoc"),"Série Documento":txt(x,"serie"),"Data Emissão Documento":txt(x,"dEmi"),"Valor Documento":num(txt(x,"vDoc"))});
 for(const x of inf.getElementsByTagNameNS(NS,"infOutros"))
   arr.push({"Arquivo":name,"Chave CT-e":chave,"Número CT-e":nct,"Tipo Documento":"Outro","Chave Documento":"","Número Documento":txt(x,"nDoc"),"Série Documento":txt(x,"serie"),"Data Emissão Documento":txt(x,"dEmi"),"Valor Documento":num(txt(x,"vDoc"))});
 return arr;
}

$("convert").onclick=async()=>{
 $("convert").disabled=true;$("status").textContent="Lendo arquivos e extraindo CT-es...";
 errors=[];xmls=[];let ctes=[],docs=[];
 try{
   // JSZip é carregado dinamicamente para manter a página simples.
   if(typeof JSZip==="undefined"){
     await new Promise((resolve,reject)=>{
       const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
     });
   }
   xmls=await extract();$("nXml").textContent=xmls.length;
   for(const x of xmls){try{const r=parseCTe(x);ctes.push(r.n);docs.push(...r.docs)}catch(e){errors.push([x.name,e.message])}}
   if(!ctes.length)throw new Error("Nenhum CT-e válido foi encontrado.");
   const wb=XLSX.utils.book_new();
   const add=(name,rows)=>{const ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,name);};
   add("CT-es",ctes);
   add("Documentos",docs);
   add("Erros",errors.map(e=>({Arquivo:e[0],Mensagem:e[1]})));
   XLSX.writeFile(wb,"CTes_Convertidos.xlsx");
   $("nCte").textContent=ctes.length;$("nErr").textContent=errors.length;
   $("status").textContent=`Concluído!\n${ctes.length} CT-e(s) convertido(s), ${docs.length} documento(s) vinculado(s) e ${errors.length} erro(s).\nO Excel foi baixado para seu dispositivo.`;
 }catch(e){$("status").textContent="Erro: "+e.message;$("nErr").textContent=errors.length+1}
 $("convert").disabled=false;
};
</script>
</body>
</html>
